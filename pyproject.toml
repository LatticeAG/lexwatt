[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexwatt"
version = "1.0.0"
description = "Estimate model work, meter local package energy, stop the contained workload when its budget is exhausted."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "LatticeAG / LatticeAGI lab" }]
keywords = ["energy", "budget", "cgroup", "rapl", "containment", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
# cryptography is the audited Ed25519 provider; it is the only runtime
# dependency. Everything else is Python 3.12 standard library.
dependencies = ["cryptography>=41.0.7,<46"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
agent-cap = "lexwatt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lexwatt = ["py.typed"]
